name: artisan_market
description: >-
  AI-Driven Market Linkage & Smart Cataloging for Marginalized Artisans —
  SIH PS 26090 prototype (Flutter).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # state + navigation
  provider: ^6.1.2
  go_router: ^14.2.7

  # networking
  http: ^1.2.2

  # web-safe file byte access (image_picker / record return an XFile / path)
  cross_file: ^0.3.4+2

  # device capabilities
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # ui
  fl_chart: ^0.69.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
