org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation cannot compute relative paths when plugin
# sources live in the Pub cache on C: and the build dir is on E: (different
# Windows drive roots -> "this and base files have different roots").
# Disabling it does a full Kotlin recompile of the ~4 plugin modules each
# build (a few extra seconds) and sidesteps the crash.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
