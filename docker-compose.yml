services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
      POSTGRES_DB: sih
    ports:
      - "5432:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIH_DATABASE_URL: postgresql+psycopg://sih:sih@db:5432/sih
      SIH_JWT_SECRET: docker-dev-secret
      SIH_ENVIRONMENT: docker
    ports:
      - "8000:8000"
    volumes:
      - sih_media:/app/data/uploads

volumes:
  sih_pgdata:
  sih_media:
